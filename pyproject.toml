[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "uoft-mcp"
version = "0.5.0"
description = "MCP tools for UofT Timetable Builder and read-only Degree Explorer and ACORN data."
readme = "README.md"
license = "MIT"
authors = [{ name = "SleepyPandas" }]
keywords = ["acorn", "degree-explorer", "mcp", "timetable", "uoft", "university-of-toronto"]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=44,<49",
    "filelock>=3.18,<4",
    "httpx>=0.28,<1",
    "keyring>=25.6,<26",
    "mcp>=2,<3",
    "platformdirs>=4.3,<5",
    "playwright>=1.51,<2",
    "pydantic>=2.11,<3",
]

[project.urls]
Homepage = "https://github.com/SleepyPandas/UofT-MCP"
Issues = "https://github.com/SleepyPandas/UofT-MCP/issues"
Repository = "https://github.com/SleepyPandas/UofT-MCP"

[project.scripts]
uoft-mcp = "uoft_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["uoft_mcp"]
artifacts = ["uoft_mcp/timetable_builder/reference.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".test-*", "pytest-codex-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
